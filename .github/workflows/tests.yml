name: Automated tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-and-html:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r esg_rapport/requirements.txt
      - run: python -m unittest discover -s tests -v

  pdf-integration:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update
      - run: sudo apt-get install -y wkhtmltopdf poppler-utils xvfb fonts-dejavu-core
      - run: python -m pip install -r esg_rapport/requirements.txt
      - run: xvfb-run -a python -m unittest discover -s tests -p test_reports.py -v
        env:
          ESG_REQUIRE_PDF: '1'
